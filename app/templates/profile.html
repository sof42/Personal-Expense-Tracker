<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Profile for {{ username }}</h2>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card p-4 mt-3 shadow-sm">
        <form method="POST">
            <!-- Hidden input to simulate PUT -->
            <input type="hidden" name="_method" value="PUT">

            <!-- Email & Password -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter new email" value="{{ email }}">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter new password">
                <small class="text-muted">Leave blank to keep current password</small>
            </div>

            <!-- Limits -->
            <div class="mb-3">
                <label class="form-label">Daily Limit ($)</label>
                <input type="number" class="form-control" name="daily_limit" step="0.01"
                       value="{{ daily_limit }}" min="0">
            </div>
            <div class="mb-3">
                <label class="form-label">Monthly Limit ($)</label>
                <input type="number" class="form-control" name="monthly_limit" step="0.01"
                       value="{{ monthly_limit }}" min="0">
            </div>
            <div class="mb-3">
                <label class="form-label">Yearly Limit ($)</label>
                <input type="number" class="form-control" name="yearly_limit" step="0.01"
                       value="{{ yearly_limit }}" min="0">
            </div>

            <button type="submit" class="btn btn-primary w-100">Update Profile</button>
        </form>

        <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary w-100 mt-3">Back to Dashboard</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
